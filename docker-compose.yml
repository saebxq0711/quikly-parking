services:
  db:
    image: postgres:16-alpine
    container_name: parking_payments_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking_payments
    ports:
      - "5433:5432"
    volumes:
      - parking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_payments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parking_pgdata:
